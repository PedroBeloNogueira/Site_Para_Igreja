name: Atualizar liturgia, notícias e santos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noticias.yml'
      - 'scripts/**'
      - 'js/**'
      - '*.html'
      - 'styles.css'
      - 'assets/**'
  schedule:
    - cron: '23 9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar-noticias
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar liturgia de hoje e dos próximos dias
        continue-on-error: true
        run: node scripts/atualizar-liturgia.mjs
      - name: Preparar homenagens de hoje e dos próximos dias
        continue-on-error: true
        shell: pwsh
        run: ./scripts/atualizar-santos.ps1
      - name: Consultar o RSS oficial
        continue-on-error: true
        shell: pwsh
        run: ./scripts/atualizar-noticias.ps1
      - name: Salvar notícias atualizadas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json data/santos.json data/liturgia-auto.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza liturgia, notícias e homenagens do dia"
          git push
      - name: Preparar site para GitHub Pages
        if: vars.PUBLICAR_GITHUB_PAGES == 'true'
        shell: bash
        run: |
          mkdir -p _site
          cp index.html liturgia.html oracoes.html noticias.html contribua.html styles.css _site/
          cp -R js data _site/
          if [ -d assets ]; then cp -R assets _site/; fi
      - uses: actions/upload-pages-artifact@v4
        if: vars.PUBLICAR_GITHUB_PAGES == 'true'
        with:
          path: _site
  publicar:
    if: vars.PUBLICAR_GITHUB_PAGES == 'true'
    needs: atualizar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
