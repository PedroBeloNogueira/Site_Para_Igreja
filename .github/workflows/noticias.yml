name: Atualizar notícias do Vatican News
on:
  schedule:
    - cron: '23 9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar-noticias
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultar o RSS oficial
        shell: pwsh
        run: ./scripts/atualizar-noticias.ps1
      - name: Salvar notícias atualizadas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza notícias do Vatican News"
          git push
      - name: Preparar site para GitHub Pages
        if: vars.PUBLICAR_GITHUB_PAGES == 'true'
        shell: bash
        run: |
          mkdir -p _site
          cp index.html oracoes.html styles.css _site/
          cp -R js data assets _site/
      - uses: actions/upload-pages-artifact@v4
        if: vars.PUBLICAR_GITHUB_PAGES == 'true'
        with:
          path: _site
  publicar:
    if: vars.PUBLICAR_GITHUB_PAGES == 'true'
    needs: atualizar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
